name: CI - Build & Type Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Derleme ve Tip Guvenligi Dogrulamasi
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak Kodunu Indir (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ortamini Hazirla (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bagimliliklari Kur (Clean Install)
        run: npm ci

      - name: '1. Urun: Islahiye Lezzet Atlasi Derleme ve Tip Kontrolu'
        run: npm run build:gastronomi

      - name: '2. Urun: Islahiye Egitim Portali Derleme ve Tip Kontrolu'
        run: npm run build:egitim
