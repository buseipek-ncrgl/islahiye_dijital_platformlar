name: CI - Build & Type Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Eşzamanlı commitlerde eski çalışan işi iptal et (kaynak tasarrufu)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Derleme ve Tip Güvenliği Doğrulaması
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak Kodunu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ortamını Hazırla (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Kur (Workspace Install)
        run: npm ci

      - name: 1. Ürün: İslahiye Lezzet Atlası Derleme & Tip Kontrolü
        run: npm run build:gastronomi

      - name: 2. Ürün: İslahiye Eğitim Portalı Derleme & Tip Kontrolü
        run: npm run build:egitim
