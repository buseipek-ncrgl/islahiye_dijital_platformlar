<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 85 85" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Bakır Güğüm / Demlik (Tarif Atölyesi) -->
