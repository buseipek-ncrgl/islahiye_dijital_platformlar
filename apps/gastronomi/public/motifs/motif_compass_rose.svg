<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Concentric Cartographic Measuring Rings -->
  <circle cx="100" cy="100" r="88" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 3"/>
  <circle cx="100" cy="100" r="80" stroke-width="1.6"/>
  <circle cx="100" cy="100" r="72" stroke-width="0.8" opacity="0.6"/>
  <circle cx="100" cy="100" r="28" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="10" stroke-width="1.4" fill="currentColor" fill-opacity="0.15"/>

  <!-- Degree Tick Marks around circumference (every 30 deg) -->
  <line x1="100" y1="20" x2="100" y2="28" stroke-width="1.2"/>
  <line x1="100" y1="172" x2="100" y2="180" stroke-width="1.2"/>
  <line x1="20" y1="100" x2="28" y2="100" stroke-width="1.2"/>
  <line x1="172" y1="100" x2="180" y2="100" stroke-width="1.2"/>
  <line x1="43" y1="43" x2="49" y2="49" stroke-width="1.0"/>
  <line x1="157" y1="43" x2="151" y2="49" stroke-width="1.0"/>
  <line x1="43" y1="157" x2="49" y2="151" stroke-width="1.0"/>
  <line x1="157" y1="157" x2="151" y2="151" stroke-width="1.0"/>

  <!-- Cardinal Letters in Classic Serif -->
  <!-- K (North / Kuzey) -->
  <path d="M 96 16 L 96 6 M 104 6 L 96 11 L 104 16" stroke-width="1.4" fill="none"/>
  <!-- G (South / Güney) -->
  <path d="M 104 186 C 103 184, 100 183, 97 185 C 95 188, 95 192, 97 195 C 100 197, 104 196, 104 192 L 100 192" stroke-width="1.4" fill="none"/>
  <!-- D (East / Doğu) -->
  <path d="M 186 96 L 186 104 C 186 104, 192 104, 192 100 C 192 96, 186 96, 186 96 Z" stroke-width="1.4" fill="none"/>
  <!-- B (West / Batı) -->
  <path d="M 14 96 L 14 104 M 14 96 C 18 96, 18 100, 14 100 C 18 100, 18 104, 14 104" stroke-width="1.4" fill="none"/>

  <!-- 8-Point Cartographic Star -->
  <!-- 4 Principal Points (K, G, D, B) with Woodcut Facet Shading -->
  <!-- North Point -->
  <polygon points="100,100 92,100 100,28" fill="currentColor" fill-opacity="0.85" stroke-width="1.2"/>
  <polygon points="100,100 108,100 100,28" fill="none" stroke-width="1.2"/>
  <!-- Fine cross-hatching inside unshaded North facet -->
  <line x1="101" y1="38" x2="106" y2="45" stroke-width="0.6" opacity="0.7"/>
  <line x1="101" y1="50" x2="107" y2="60" stroke-width="0.6" opacity="0.7"/>
  <line x1="101" y1="65" x2="107" y2="75" stroke-width="0.6" opacity="0.7"/>
  <line x1="101" y1="80" x2="108" y2="90" stroke-width="0.6" opacity="0.7"/>

  <!-- South Point -->
  <polygon points="100,100 108,100 100,172" fill="currentColor" fill-opacity="0.85" stroke-width="1.2"/>
  <polygon points="100,100 92,100 100,172" fill="none" stroke-width="1.2"/>
  <line x1="99" y1="162" x2="94" y2="155" stroke-width="0.6" opacity="0.7"/>
  <line x1="99" y1="150" x2="93" y2="140" stroke-width="0.6" opacity="0.7"/>
  <line x1="99" y1="135" x2="93" y2="125" stroke-width="0.6" opacity="0.7"/>

  <!-- East Point -->
  <polygon points="100,100 100,92 172,100" fill="currentColor" fill-opacity="0.85" stroke-width="1.2"/>
  <polygon points="100,100 100,108 172,100" fill="none" stroke-width="1.2"/>
  <line x1="162" y1="101" x2="155" y2="106" stroke-width="0.6" opacity="0.7"/>
  <line x1="150" y1="101" x2="140" y2="107" stroke-width="0.6" opacity="0.7"/>
  <line x1="135" y1="101" x2="125" y2="107" stroke-width="0.6" opacity="0.7"/>

  <!-- West Point -->
  <polygon points="100,100 100,108 28,100" fill="currentColor" fill-opacity="0.85" stroke-width="1.2"/>
  <polygon points="100,100 100,92 28,100" fill="none" stroke-width="1.2"/>
  <line x1="38" y1="99" x2="45" y2="94" stroke-width="0.6" opacity="0.7"/>
  <line x1="50" y1="99" x2="60" y2="93" stroke-width="0.6" opacity="0.7"/>
  <line x1="65" y1="99" x2="75" y2="93" stroke-width="0.6" opacity="0.7"/>

  <!-- 4 Half-Points (NE, SE, SW, NW) - Shorter Points -->
  <!-- NE -->
  <polygon points="100,100 96,96 148,52" fill="currentColor" fill-opacity="0.6" stroke-width="1.0"/>
  <polygon points="100,100 104,104 148,52" fill="none" stroke-width="1.0"/>
  <!-- SE -->
  <polygon points="100,100 104,96 148,148" fill="currentColor" fill-opacity="0.6" stroke-width="1.0"/>
  <polygon points="100,100 96,104 148,148" fill="none" stroke-width="1.0"/>
  <!-- SW -->
  <polygon points="100,100 104,104 52,148" fill="currentColor" fill-opacity="0.6" stroke-width="1.0"/>
  <polygon points="100,100 96,96 52,148" fill="none" stroke-width="1.0"/>
  <!-- NW -->
  <polygon points="100,100 96,104 52,52" fill="currentColor" fill-opacity="0.6" stroke-width="1.0"/>
  <polygon points="100,100 104,96 52,52" fill="none" stroke-width="1.0"/>

  <!-- Central Brass Boss / Rivet -->
  <circle cx="100" cy="100" r="5" fill="#FFFDF8" stroke="currentColor" stroke-width="1.4"/>
  <circle cx="100" cy="100" r="2" fill="currentColor"/>
</svg>
