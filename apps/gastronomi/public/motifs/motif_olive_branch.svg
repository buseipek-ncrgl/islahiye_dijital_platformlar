<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main stem with woodcut texture -->
  <path d="M 25 180 C 60 155, 95 115, 145 65 C 160 50, 172 38, 182 25" stroke-width="2.4"/>
  <path d="M 32 175 C 65 152, 98 116, 142 69" stroke-width="1.0" stroke-dasharray="2 3" opacity="0.6"/>
  <!-- Secondary twig -->
  <path d="M 82 124 C 105 110, 132 98, 155 78" stroke-width="1.6"/>
  <path d="M 122 84 C 138 72, 154 58, 168 40" stroke-width="1.4"/>

  <!-- Leaf 1 (Bottom Left) -->
  <g class="leaf">
    <path d="M 48 142 C 32 136, 20 118, 28 102 C 42 108, 52 126, 48 142 Z" fill="currentColor" fill-opacity="0.10" stroke-width="1.5"/>
    <path d="M 48 142 Q 36 124 28 102" stroke-width="1.0"/>
    <!-- Leaf veins & cross-hatching -->
    <path d="M 44 135 L 36 130 M 42 128 L 32 122 M 39 120 L 30 114 M 36 112 L 28 108" stroke-width="0.7" opacity="0.7"/>
    <path d="M 46 138 L 48 130 M 44 130 L 46 122 M 42 122 L 44 114" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- Leaf 2 (Mid Left Up) -->
  <g class="leaf">
    <path d="M 78 118 C 65 104, 58 82, 68 68 C 82 76, 88 98, 78 118 Z" fill="currentColor" fill-opacity="0.10" stroke-width="1.5"/>
    <path d="M 78 118 Q 70 95 68 68" stroke-width="1.0"/>
    <path d="M 76 110 L 68 102 M 74 100 L 64 92 M 72 90 L 64 82 M 70 80 L 64 74" stroke-width="0.7" opacity="0.7"/>
    <path d="M 77 112 L 80 102 M 76 102 L 78 92 M 74 92 L 76 82" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- Leaf 3 (Top Left) -->
  <g class="leaf">
    <path d="M 115 85 C 105 68, 104 46, 118 34 C 130 44, 132 68, 115 85 Z" fill="currentColor" fill-opacity="0.10" stroke-width="1.5"/>
    <path d="M 115 85 Q 112 60 118 34" stroke-width="1.0"/>
    <path d="M 114 78 L 108 68 M 113 68 L 107 58 M 114 58 L 109 48" stroke-width="0.7" opacity="0.7"/>
    <path d="M 116 78 L 122 68 M 117 68 L 123 58 M 118 58 L 124 48" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- Leaf 4 (Terminal Leaf - Top Right) -->
  <g class="leaf">
    <path d="M 155 52 C 158 35, 172 20, 186 16 C 188 32, 175 48, 155 52 Z" fill="currentColor" fill-opacity="0.10" stroke-width="1.5"/>
    <path d="M 155 52 Q 170 36 186 16" stroke-width="1.0"/>
    <path d="M 160 46 L 164 36 M 168 38 L 172 28 M 176 30 L 180 22" stroke-width="0.7" opacity="0.7"/>
  </g>

  <!-- Leaf 5 (Bottom Right branch) -->
  <g class="leaf">
    <path d="M 108 126 C 122 134, 144 130, 154 116 C 142 110, 122 112, 108 126 Z" fill="currentColor" fill-opacity="0.10" stroke-width="1.5"/>
    <path d="M 108 126 Q 130 122 154 116" stroke-width="1.0"/>
    <path d="M 118 125 L 124 131 M 128 123 L 134 129 M 138 121 L 144 127" stroke-width="0.7" opacity="0.7"/>
  </g>

  <!-- Leaf 6 (Mid Right branch) -->
  <g class="leaf">
    <path d="M 142 88 C 158 92, 176 84, 184 68 C 170 64, 152 72, 142 88 Z" fill="currentColor" fill-opacity="0.10" stroke-width="1.5"/>
    <path d="M 142 88 Q 162 78 184 68" stroke-width="1.0"/>
    <path d="M 152 86 L 158 91 M 162 82 L 168 87 M 172 78 L 178 83" stroke-width="0.7" opacity="0.7"/>
  </g>

  <!-- Olive 1 (Mid-left plump olive) -->
  <g class="olive">
    <!-- Stem connection -->
    <path d="M 65 132 C 60 138, 58 144, 59 148" stroke-width="1.2"/>
    <!-- Oval fruit with volume -->
    <ellipse cx="63" cy="158" rx="9" ry="13" transform="rotate(-20 63 158)" fill="currentColor" fill-opacity="0.22" stroke-width="1.6"/>
    <!-- Curved highlight & woodcut hatching -->
    <path d="M 57 150 C 56 156, 58 164, 62 168" stroke-width="1.0" opacity="0.9"/>
    <path d="M 66 152 C 69 156, 69 162, 67 166" stroke-width="0.7" opacity="0.6"/>
    <path d="M 68 155 L 71 157 M 67 160 L 70 162 M 65 164 L 68 166" stroke-width="0.6" opacity="0.7"/>
    <circle cx="62" cy="171" r="0.8" fill="currentColor"/>
  </g>

  <!-- Olive 2 (Center upper olive) -->
  <g class="olive">
    <path d="M 104 100 C 102 106, 102 110, 104 114" stroke-width="1.2"/>
    <ellipse cx="108" cy="124" rx="8.5" ry="12.5" transform="rotate(25 108 124)" fill="currentColor" fill-opacity="0.22" stroke-width="1.6"/>
    <path d="M 103 118 C 103 124, 105 130, 109 133" stroke-width="1.0" opacity="0.9"/>
    <path d="M 112 118 L 115 121 M 111 123 L 114 126 M 109 128 L 112 131" stroke-width="0.6" opacity="0.7"/>
    <circle cx="112" cy="136" r="0.8" fill="currentColor"/>
  </g>

  <!-- Olive 3 (Far right olive) -->
  <g class="olive">
    <path d="M 148 68 C 146 72, 146 76, 149 80" stroke-width="1.2"/>
    <ellipse cx="154" cy="90" rx="8" ry="11.5" transform="rotate(-15 154 90)" fill="currentColor" fill-opacity="0.22" stroke-width="1.6"/>
    <path d="M 149 84 C 148 89, 150 94, 153 98" stroke-width="0.9" opacity="0.9"/>
    <path d="M 157 86 L 160 88 M 156 91 L 159 93 M 154 95 L 157 97" stroke-width="0.6" opacity="0.7"/>
    <circle cx="156" cy="101" r="0.8" fill="currentColor"/>
  </g>
</svg>
